<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        Bug Tracker {{ '- {}'.format(title) if title }}
    </title>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="76x76" href="{{ url_for('static', path='/images/fav/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='/images/fav/favicon.ico') }}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no'
        name='viewport' />
    <!--     Fonts and icons     -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- CSS Files -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 text-gray-800">

    <div class="min-h-screen">

        {% block sidebar %}{% endblock %}

        <main id="root" class="md:ml-64">

            {% block header %}{% endblock %}

            {% block main %}{% endblock %}

            {% block footer %}{% endblock %}

        </main>


    </div>

    {% block btn_create_issue %}{% endblock %}

</body>

</html>
