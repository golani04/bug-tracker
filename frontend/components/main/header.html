<header class="bg-white border-b border-gray-200">
    <div class="px-4 sm:px-6 py-3 flex items-center justify-between">
        <span class="text-lg font-semibold">{{ current_page | title }}</span>
        <div class="flex items-center gap-4">
            <details class="relative">
                <summary class="list-none cursor-pointer relative text-gray-500 hover:text-gray-700">
                    <i class="far fa-bell text-lg"></i>
                    <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">5</span>
                </summary>
                <ul class="absolute right-0 mt-2 w-56 bg-white border border-gray-200 rounded-md shadow-lg py-1 z-10">
                    <li><a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" href="#">Notification 1</a></li>
                    <li><a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" href="#">Notification 2</a></li>
                    <li><a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" href="#">Notification 3</a></li>
                    <li><a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" href="#">Notification 4</a></li>
                    <li><a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" href="#">Another notification</a></li>
                </ul>
            </details>
            <form action="/logout" method="post">
                <button type="submit" class="text-sm font-medium text-gray-600 hover:text-gray-900">
                    Log out
                </button>
            </form>
        </div>
    </div>
</header>
