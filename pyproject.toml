[tool.black]
line-length = 100
exclude = '''
(
  /(
    | \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.pytest_cache
    | \.tox
    | __pycache__
  )/
)
'''

[tool.isort]
profile = "black"
combine_as_imports = true
line_length = 100
lines_after_imports = 2
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.coverage.run]
# when line in code could jump to more than 
# one next line, track which destinations 
# were visited
branch = true

omit = '''
    # exclude tests folder
    tests/*
    # exclude venv files
    */venv/*
    # exclude init files
    *\__init__.py
'''

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.coverage.html]
directory = "reports"

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
# addopts = "--color=yes --cov=backend --cov-report=html --cov-report=term -ra"
testpaths = ["tests"]
markers = ["api"]

[tool.poetry]
name = "bug-tracker"
license = "MIT"
version = "0.2.0"
readme = "README.md"
description = "Register issues that occured in the projects."
authors = ["Leonid <golani04@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
bcrypt = "4.0.1"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pydantic = { extras = ["email"], version = "^2.6.3" }
pydantic-settings = "^2.2.1"
uvicorn = "^0.27.1.0"
requests = "^2.31.0"
SQLAlchemy = "^2.0.27"
Jinja2 = "^3.1.3"
aiofiles = "^23.2.1"
python-multipart = "^0.0.6"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
aiohttp = "^3.9.3.5"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.5"
black = "^23.3.0"
coverage = "^7.2.5"
flake8 = "^6.0.0"
freezegun = "^1.2.2"
isort = "^5.12.0"
pytest = "^7.3.1"
mypy = "^1.3.0"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.5.post1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
