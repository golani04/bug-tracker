[project]
name = "bug-tracker"
license = "MIT"
version = "0.2.0"
readme = "README.md"
description = "Register issues that occured in the projects."
authors = [{ name = "Leonid", email = "golani04@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "bcrypt==5.0.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
    "requests==2.34.2",
    "SQLAlchemy==2.0.52",
    "Jinja2==3.1.6",
    "aiofiles==25.1.0",
    "python-multipart==0.0.32",
    "python-jose[cryptography]==3.5.0",
    "aiohttp==3.14.3",
    "gunicorn==26.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.7.5,<2.0.0",
    "ruff>=0.6.0",
    "coverage>=7.2.5,<8.0.0",
    "freezegun>=1.2.2,<2.0.0",
    "pytest==9.1.1",
    "mypy==2.3.1",
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
line-ending = "auto"

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__."]

[tool.coverage.html]
directory = "reports"

[tool.pytest.ini_options]
minversion = "7.3"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["api: marks API tests"]
